<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>買い物リスト & ストック管理 v1.0</title>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@0.469.0"></script>

    <!-- QRCode.js Library for QR Code Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- SortableJS for Drag & Drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-24 no-select">

    <!-- Header Navigation -->
    <header class="bg-white shadow-sm sticky top-0 z-20">
        <div class="max-w-2xl mx-auto px-4 py-3 flex items-center justify-between">
            <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
                <i data-lucide="shopping-bag" class="text-emerald-600"></i>買い物リスト & ストック管理
            </h1>
            <div class="flex items-center gap-1">
                <button id="shareBtn" type="button" class="p-2 rounded-full hover:bg-emerald-100 flex items-center gap-1 text-xs font-bold bg-emerald-50 text-emerald-700 px-3">
                    <i data-lucide="share-2" class="w-4 h-4"></i> 共有・保存
                </button>
            </div>
        </div>

        <!-- View Switcher Tabs -->
        <div class="max-w-2xl mx-auto px-4 flex border-b border-slate-200">
            <button id="tabShopping" type="button" data-tab="shopping" class="flex-1 py-3 text-center text-sm border-b-2 flex items-center justify-center gap-1 font-bold border-emerald-600 text-emerald-600">
                <i data-lucide="shopping-cart" class="w-4 h-4"></i> 買い物モード
            </button>
            <button id="tabManage" type="button" data-tab="manage" class="flex-1 py-3 text-center text-sm border-b-2 flex items-center justify-center gap-1 font-semibold border-transparent text-slate-500 hover:text-slate-700">
                <i data-lucide="boxes" class="w-4 h-4"></i> 予測＆在庫管理
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-2xl mx-auto p-4">

        <!-- Banner for Restored Data via URL -->
        <div id="restoredBanner" class="hidden mb-4 p-3 bg-emerald-100 border border-emerald-300 rounded-xl text-emerald-800 text-sm flex items-center justify-between">
            <span class="flex items-center gap-2">
                <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600"></i>
                URLからデータを読み込みました！
            </span>
            <button id="restoredBannerClose" type="button" aria-label="閉じる" class="text-emerald-700 font-bold">✕</button>
        </div>

        <!-- VIEW 1: Shopping Mode -->
        <section id="viewShopping" class="space-y-4">
            
            <div class="flex items-center justify-between text-xs text-slate-500 px-1">
                <span>カードタップでカウントアップ</span>
                <div class="flex items-center gap-2">
                    <button id="toggleColumnsBtn" type="button" class="flex items-center gap-1 px-2.5 py-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-700 font-medium">
                        <i data-lucide="layout-grid" class="w-3.5 h-3.5"></i> <span id="colBtnText">3列表示</span>
                    </button>
                    <button id="toggleSortBtn" type="button" class="flex items-center gap-1 px-2.5 py-1 bg-slate-200 hover:bg-slate-300 rounded text-slate-700 font-medium">
                        <i data-lucide="arrow-up-down" class="w-3.5 h-3.5"></i> <span id="sortBtnText">並び替え</span>
                    </button>
                </div>
            </div>

            <!-- Item Buttons Grid -->
            <div id="itemGrid" class="grid grid-cols-2 gap-3 transition-all">
                <!-- Dynamic Items Inserted Here -->
            </div>
        </section>

        <!-- VIEW 2: Predictive Stock & Management -->
        <section id="viewManage" class="hidden space-y-4">
            
            <div class="flex items-center justify-between px-1">
                <span class="text-xs text-slate-500">予測ストックとアラートの編集</span>
                <button id="addNewItemBtn" type="button" class="flex items-center gap-1 text-xs bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-1.5 px-3 rounded-lg shadow-sm">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> アイテム追加
                </button>
            </div>

            <div id="manageList" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Dynamic List Inserted Here -->
            </div>
        </section>

    </main>

    <!-- Bottom Floating Cart Bar -->
    <div id="cartBar" class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-lg p-4 transition-transform transform translate-y-full duration-300 z-30">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
            <div class="flex-1">
                <div class="text-xs text-slate-500 font-medium">選択中の購入予定</div>
                <div id="cartSummary" class="text-sm font-bold text-slate-800 truncate">なし</div>
            </div>
            <button id="commitPurchaseBtn" type="button" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-6 py-3 rounded-xl shadow-md flex items-center gap-2">
                <i data-lucide="check" class="w-5 h-5"></i> 買いました！
            </button>
        </div>
    </div>

    <!-- SHARE MODAL -->
    <div id="shareModal" role="dialog" aria-modal="true" aria-labelledby="shareModalTitle" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 id="shareModalTitle" class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-lucide="qr-code" class="text-emerald-600"></i> データ共有・ブックマーク
                </h3>
                <button id="closeShareModal" type="button" aria-label="閉じる" class="text-slate-400 hover:text-slate-600 font-bold text-xl">✕</button>
            </div>
            
            <p class="text-xs text-slate-600 leading-relaxed">
                現在のデータがすべて入ったURLです。ブックマークするかLINE等で共有すれば端末を変えても復元できます。
            </p>

            <div class="flex justify-center p-3 bg-slate-50 rounded-xl border">
                <div id="qrcode"></div>
            </div>

            <div class="space-y-2">
                <button id="copyUrlBtn" type="button" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl flex items-center justify-center gap-2 text-sm shadow-sm">
                    <i data-lucide="copy" class="w-4 h-4"></i> URLをコピーする
                </button>
                <div id="copyNotice" class="text-center text-xs text-emerald-600 font-bold hidden">URLをコピーしました！</div>
            </div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl p-5 space-y-4 shadow-xl">
            <h3 id="modalTitle" class="text-lg font-bold text-slate-800 border-b pb-2">アイテムの追加</h3>
            
            <form id="itemForm" class="space-y-3 text-sm">
                <input type="hidden" id="editItemId">
                
                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">アイテム名</label>
                    <input type="text" id="inputName" required placeholder="例: トイレットペーパー" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">現在のストック数</label>
                        <input type="number" id="inputStock" min="0" required class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">アラート閾値</label>
                        <input type="number" id="inputAlert" min="1" required class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-600 mb-1">1個あたりの消費日数（目安）</label>
                    <input type="number" id="inputDaysPerUnit" min="1" required placeholder="例: 7" class="w-full border border-slate-300 rounded-lg p-2 focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                </div>

                <div class="flex justify-end gap-2 pt-2 border-t">
                    <button type="button" id="closeEditModal" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 rounded-lg font-bold text-slate-600">キャンセル</button>
                    <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg shadow-sm">保存する</button>
                </div>
            </form>
        </div>
    </div>

    <script src="./src.js"></script>
</body>
</html>
